<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Need for Speed: Shahar prototipi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loading"><b>Modellar yuklanmoqda</b><div class="lb"><i id="lbar"></i></div><span id="ltxt">0%</span><div id="lerr"></div><button id="lretry">Qayta urinish</button></div>
<div id="rotate">Telefonni gorizontal holatga buring</div>
<div id="start"><div class="card"><h1>Mashina tanlash</h1><p>Sichqoncha / barmoq bilan aylantiring</p>
<div id="pick"><button id="prev">◀</button><b id="cname">1-mashina</b><button id="next">▶</button></div>
<button id="go" disabled>Poygani boshlash</button><small>Ovoz yoqilishi uchun tugmani bosing</small></div></div><div id="cd"></div>
<div class="hud" id="top-l"><div class="panel" id="info"><span id="pos">Mashina tanlash</span><br><span id="res"></span> · <span id="fps"></span></div><canvas id="mini" width="132" height="132"></canvas></div>
<div class="hud" id="top-r">
<div id="tools"><button id="btnMenu">Menyu</button><button id="btnCam">Kamera: <span id="camName">Yaqin</span></button></div>
<div id="menuBox"><button id="btnSnd">Ovoz: yoqiq</button><button id="btnFs">Toʻliq ekran</button><div id="q"><button data-q="auto" class="on">Avto</button><button data-q="fhd">Full HD</button><button data-q="4k">4K</button></div></div></div>
<div class="hud" id="gauge"><canvas id="tach" width="220" height="220"></canvas><div id="gcenter"><b id="kmh">0</b><span>km/soat</span><i id="gear">N</i></div></div>
<div class="hud" id="help">W/↑ gaz · S/↓ tormoz · A D/←→ burilish · Probel qoʻl tormozi · C kamera · M ovoz</div>
<div id="wheel"></div>
<div id="pedals"><div id="brk"></div><div id="gas"></div></div>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script defer src="models.js"></script>
<script defer src="engine.js"></script>
<script defer src="sky.js"></script>
<script defer src="map.js"></script>
<script defer src="Garage.js"></script>
<script defer src="Buildings.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script defer src="StartGirl.js"></script>
<script defer src="People.js"></script>
<script defer src="cars.js"></script>
<script defer src="ui.js"></script>
<script defer src="game.js"></script>

</body>
</html>
